name: Publish Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site and 1080p videos
        run: |
          mkdir -p _site/videos
          cp index.html styles.css _site/
          for pair in en-zh en-ja en-de; do
            cat "$pair".mp4.part* > _site/videos/"$pair".mp4
          done
          echo '4d0509caa0d0892a5c97677d7c3288b0ae39be95772b32ed3fc52ee5b6f2cb15  _site/videos/en-zh.mp4' | sha256sum -c
          echo '3eac3af34df3d9faed872886ec5aeec956031e222f662379e88576a4f1438786  _site/videos/en-ja.mp4' | sha256sum -c
          echo 'b67f412fba8eaaf3a37aee1ff2315cca423bbcfe7e7f8941aab6607c46d826b1  _site/videos/en-de.mp4' | sha256sum -c
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
