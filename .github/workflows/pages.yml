name: Publish Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site and 1080p videos
        run: |
          mkdir -p _site/videos
          cp index.html styles.css _site/
          for pair in en-zh en-ja en-de; do
            cp "$pair"-combined.mp4 _site/videos/"$pair".mp4
          done
          echo 'e59960412c8f88368ee2a7a03f719291fbfb894a8c475a17aad3776694785657  _site/videos/en-zh.mp4' | sha256sum -c
          echo 'c0c2f00e82b2c736f36f52d852620864af173a99d74f66379148435fa07e1f38  _site/videos/en-ja.mp4' | sha256sum -c
          echo '9d94db8958c9f3217b4a0f77f2361f8f10d21f70961ce9059848e8806c319493  _site/videos/en-de.mp4' | sha256sum -c
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
